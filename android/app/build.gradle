plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.tridi.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.tridi.app"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "2.4"
        vectorDrawables { useSupportLibrary true }
    }

    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'io.coil-kt:coil-gif:2.7.0'   // anima GIFs (demo da atividade)
    // Câmera própria (in-app) pra concluir a atividade sem sair do app.
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    // Ler código de barras com a PRÓPRIA câmera do tablet (bancada sem pistola).
    // Modelo EMBARCADO (barcode-scanning, não o -common): funciona sem Play
    // Services — mesma escolha do totem do mercadinho (tridimarket-app).
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    // Leitor de código de barras: NENHUMA dependência. O leitor pistola é HID —
    // ele se apresenta como teclado e "digita" o código, então quem lê é o
    // `dispatchKeyEvent` da Activity (com.tridi.app.scan). Ver o cabeçalho de
    // scan/LeitorExterno.kt sobre por que não entrou ML Kit nem ZXing aqui.
    testImplementation 'junit:junit:4.13.2'
}
